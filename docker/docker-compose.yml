services:
  edge:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    environment:
      DSHRC_PUBLIC_URL: ${DSHRC_PUBLIC_URL:?set DSHRC_PUBLIC_URL, e.g. https://link.example.com}
      DSHRC_TRUST_PROXY: "1"
      DSHRC_SETUP_CODE: ${DSHRC_SETUP_CODE:-}
      DSHRC_LOG_LEVEL: ${DSHRC_LOG_LEVEL:-info}
    volumes:
      - dsh-rc-data:/data
    expose:
      - "8787"
    networks: [edge]

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    depends_on: [edge]
    ports:
      - "80:80"
      - "443:443"
    environment:
      DSHRC_DOMAIN: ${DSHRC_DOMAIN:?set DSHRC_DOMAIN, e.g. link.example.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [edge]

volumes:
  dsh-rc-data:
  caddy-data:
  caddy-config:

networks:
  edge: